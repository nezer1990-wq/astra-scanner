<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>ASTRA SCANNER</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;padding:18px}
h2{text-align:center;color:#42d9b0}
h3{font-size:15px;color:#aab8cc;margin-top:25px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{background:#202e42;color:white;border:1px solid #34445c;border-radius:12px;padding:15px;font-size:15px}
button.active{background:#087e69;border-color:#35e0b7}
#scan{width:100%;margin-top:25px;background:#08a887;font-weight:bold;font-size:18px}
#result{margin-top:20px;background:#202e42;padding:18px;border-radius:12px;text-align:center}
</style>
</head>
<body>

<h2>ASTRA SCANNER</h2>
<p style="text-align:center;color:#9aabc1">Ağıllı bazar skaneri</p>

<h3>VALYUTA CÜTLÜYÜ</h3>
<div class="grid" id="pairs">
<button class="active">EUR/USD</button>
<button>GBP/USD</button>
<button>USD/JPY</button>
<button>AUD/USD</button>
<button>USD/CAD</button>
<button>USD/CHF</button>
<button>NZD/USD</button>
<button>HAMISI</button>
</div>

<h3>ƏMƏLİYYAT MÜDDƏTİ</h3>
<div class="grid" id="durations">
<button>5 saniyə</button>
<button class="active">30 saniyə</button>
<button>1 dəqiqə</button>
<button>5 dəqiqə</button>
<button>15 dəqiqə</button>
</div>

<button id="scan">🔍 SKAN ET</button>

<div id="result">Skan etməyə hazıram</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let pair = "EUR/USD";
let duration = "30 saniyə";

document.querySelectorAll("#pairs button").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll("#pairs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  pair=b.textContent;
 };
});

document.querySelectorAll("#durations button").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll("#durations button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  duration=b.textContent;
 };
});

document.getElementById("scan").onclick=()=>{
 document.getElementById("result").textContent="Skan sorğusu göndərilir...";
 if (tg.initData) {
  tg.sendData(JSON.stringify({
    action: "scan",
    pair: pair,
    duration: duration
  }));
} else {
  document.getElementById("result").textContent =
    "Telegram daxilində açın";
}
};
</script>
</body>
</html>
